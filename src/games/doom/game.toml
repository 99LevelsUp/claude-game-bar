# The DOOM game: the manifest the game registry (src/games/index.js) reads. Its skins are the entries
# of doom.toml.
name = "doom"
description = "DOOM (1993) HUD with the Doomguy mugshot"
default_skin = "doom"

# What a release before 3.0.0 saved, and what it draws now.
[legacy]
# Older theme names that still choose this game.
aliases = []
# The file name of the preset setting (GAMEBAR_PRESET) picks the size.
reads_presets = true
presets = { full = "doom-full", standard = "doom-standard", minimal = "doom-minimal" }
# The skin names of 2.x and the entries they draw: the full and standard bars are the tall bar at
# different widths. doom-minimal, doom-compact and doom-line are entries of their own.
skins = { "doom-full" = "doom", "doom-standard" = "doom" }

# The game's style: the panel, its titles and text, and the colours a value takes as it rises.
[vars]
panel = "#1c2036"
title = "#deca80"
text = "#b6bac8"
good = "#60c868"
warn = "#e0b840"
bad = "#e05440"
threshold = ["$good", "$warn", "$bad"]

# The npm package of the game's assets, pinned to one version and its npm integrity.
[assets]
package = "@claude-game-bar/doom"
version = "1.0.0"
integrity = "sha512-m/Mpt9S2N9KqLVxUG8Gnob7ULj3lzpEuWQwS0SMCPFLbRMnCWs8Ie3VtViY0ljOI08sdOy2AY3kuFt9NMwQqAA=="
