name: Test

# Runs the suite on Linux and Windows for every push to master and every pull
# request, so a platform-only difference (snapshot output, paths, temp handling)
# shows up before a release tag is pushed. Publishing stays in publish.yml.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # The same suite on Windows, the platform the bar's owner runs: Git Bash for the client, the
  # MSYS snapshots, Windows paths and process handling only run here.
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # The render daemon end to end on Linux: real daemon, real hooks and the bash client on a 1 s
  # rhythm, through /bin/sh as Claude Code runs it. About 90 s, so it runs beside the suite.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Daemon end to end
        run: npm run test:e2e

  # The script host on every supported Node on Linux and Windows: a worker thread answered
  # through Atomics.wait must stop a script that never returns on every combination. The
  # test prints its spawn, round-trip and per-call times for each combination.
  script-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 26]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Script host
        run: node test/platform/script-host.test.mjs
